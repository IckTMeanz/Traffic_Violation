<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Violation System - Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
                    linear-gradient(
                            135deg,
                            #1e3c72 0%,
                            #2a5298 100%
                    );
            overflow:hidden;
        }

        .background-circle{
            position:absolute;
            border-radius:50%;
            filter:blur(60px);
            opacity:0.5;
        }

        .circle1{
            width:300px;
            height:300px;
            background:#4facfe;
            top:-80px;
            left:-80px;
        }

        .circle2{
            width:250px;
            height:250px;
            background:#43e97b;
            bottom:-60px;
            right:-60px;
        }

        .login-container{
            width:400px;
            padding:40px;
            border-radius:20px;

            background:rgba(255,255,255,0.15);

            backdrop-filter:blur(15px);

            border:1px solid rgba(255,255,255,0.2);

            box-shadow:
                    0 8px 32px rgba(0,0,0,0.2);

            color:white;

            position:relative;
            z-index:10;
        }

        .system-title{
            text-align:center;
            margin-bottom:10px;
            font-size:28px;
            font-weight:bold;
        }

        .sub-title{
            text-align:center;
            margin-bottom:35px;
            color:rgba(255,255,255,0.8);
            font-size:14px;
        }

        .input-group{
            margin-bottom:22px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            font-size:14px;
        }

        .input-group input{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;

            background:rgba(255,255,255,0.2);

            color:white;

            outline:none;

            transition:0.3s;
        }

        .input-group input::placeholder{
            color:rgba(255,255,255,0.7);
        }

        .input-group input:focus{
            background:rgba(255,255,255,0.3);
            transform:scale(1.02);
        }

        .login-btn{
            width:100%;
            padding:14px;

            border:none;
            border-radius:12px;

            background:white;
            color:#1e3c72;

            font-size:16px;
            font-weight:bold;

            cursor:pointer;

            transition:0.3s;
        }

        .login-btn:hover{
            transform:translateY(-2px);
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
        }

        .error-message{
            background:rgba(255,0,0,0.2);
            border:1px solid rgba(255,0,0,0.4);
            padding:12px;
            border-radius:10px;
            margin-bottom:20px;
            text-align:center;
            font-size:14px;
        }

        .success-message{
            background:rgba(0,255,100,0.2);
            border:1px solid rgba(0,255,100,0.4);
            padding:12px;
            border-radius:10px;
            margin-bottom:20px;
            text-align:center;
            font-size:14px;
        }

        .footer-text{
            text-align:center;
            margin-top:25px;
            font-size:13px;
            color:rgba(255,255,255,0.7);
        }

        @media(max-width:480px){

            .login-container{
                width:90%;
                padding:30px;
            }

            .system-title{
                font-size:24px;
            }

        }
        .register-link{
            margin-top:18px;
            text-align:center;
            font-size:14px;
            color:rgba(255,255,255,0.8);
        }

        .register-link a{
            color:white;
            font-weight:bold;
            text-decoration:none;
            margin-left:4px;
            transition:0.3s;
        }

        .register-link a:hover{
            text-decoration:underline;
            opacity:0.8;
        }

        .logout-toast{
            position:fixed;
            top:30px;
            right:30px;

            background:rgba(0,255,100,0.15);
            border:1px solid rgba(0,255,100,0.4);

            color:white;

            padding:14px 22px;
            border-radius:14px;

            backdrop-filter:blur(12px);

            box-shadow:0 8px 20px rgba(0,0,0,0.2);

            z-index:9999;

            animation:
                    slideIn 0.4s ease,
                    fadeOut 0.5s ease 2.5s forwards;
        }

        @keyframes slideIn{
            from{
                opacity:0;
                transform:translateX(30px);
            }

            to{
                opacity:1;
                transform:translateX(0);
            }
        }

        @keyframes fadeOut{
            to{
                opacity:0;
                transform:translateY(-10px);
                visibility:hidden;
            }
        }

    </style>
</head>

<body>

<div class="background-circle circle1"></div>
<div class="background-circle circle2"></div>

<div class="login-container">

    <div class="system-title">
        Traffic Violation System
    </div>

    <div class="sub-title">
        AI-based traffic violation detection platform
    </div>

    <!-- Login Error -->
    <div th:if="${param.error}" class="error-message">
        <span th:text="${param.error}"></span>
    </div>


    <form th:action="@{/toAuthenticate}" method="post">

        <div class="input-group">
            <label>username</label>

            <input
                    type="text"
                    name="username"
                    placeholder="Nhập username"
                    required>
        </div>

        <div class="input-group">
            <label>Mật khẩu</label>

            <input
                    type="password"
                    name="password"
                    placeholder="Nhập mật khẩu"
                    required>
        </div>

        <button type="submit" class="login-btn">
            Đăng nhập
        </button>

        <div class="register-link">
            Nếu chưa có tài khoản?
            <a th:href="@{/register}">Đăng ký</a>
        </div>

    </form>

    <div class="footer-text">
        © 2026 Traffic Violation Detection System
    </div>

</div>

</body>
<!-- Logout Toast -->
<div
        th:if="${param.logout}"
        id="logout-toast"
        class="logout-toast">

    Đăng xuất thành công

</div>
<script th:if="${param.logout}">
    setTimeout(() => {
        const toast = document.getElementById('logout-toast');

        if(toast){
            toast.remove();
        }
    }, 3000);
</script>
</html>
