<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Violation System - Register</title>
    <!-- Nhúng thêm FontAwesome để hộp thông báo có icon trực quan giống trang Admin -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            overflow: hidden;
        }

        .background-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.5;
        }

        .circle1 {
            width: 300px;
            height: 300px;
            background: #4facfe;
            top: -80px;
            left: -80px;
        }

        .circle2 {
            width: 250px;
            height: 250px;
            background: #43e97b;
            bottom: -60px;
            right: -60px;
        }

        .register-container {
            width: 420px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            color: white;
            position: relative;
            z-index: 10;
        }

        .system-title {
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: bold;
        }

        .sub-title {
            text-align: center;
            margin-bottom: 35px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            outline: none;
            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.02);
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: white;
            color: #1e3c72;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .register-btn:disabled {
            background: #cccccc;
            color: #666666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .login-link a {
            color: white;
            font-weight: bold;
            text-decoration: none;
            margin-left: 4px;
            transition: 0.3s;
        }

        .login-link a:hover {
            text-decoration: underline;
            opacity: 0.8;
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* ================================================================
           TOAST NOTIFICATION SYSTEM (Hệ thống thông báo góc phải)
           ================================================================ */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toast-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #ffffff;
            color: #0f172a;
            border-radius: 12px;
            padding: 14px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            font-size: 0.875rem;
            font-weight: 500;
            min-width: 300px;
            max-width: 450px;
            line-height: 1.4;
            animation: slideIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            transition: all 0.3s ease;
        }

        .toast-item.success {
            border-left: 5px solid #16a34a;
        }

        .toast-item.error {
            border-left: 5px solid #dc2626;
        }

        .toast-item i {
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        .toast-item .toast-text {
            flex-grow: 1;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100%) translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0) translateY(0);
            }
        }

        @media(max-width:480px){
            .register-container {
                width: 90%;
                padding: 30px;
            }
            .system-title {
                font-size: 24px;
            }
            .toast-container {
                top: 16px;
                right: 16px;
                left: 16px;
                width: calc(100% - 32px);
            }
            .toast-item {
                min-width: 100%;
            }
        }
    </style>
</head>

<body>

<!-- Container chứa các thông báo nổi bật lên -->
<div class="toast-container" id="toast-container"></div>

<div class="background-circle circle1"></div>
<div class="background-circle circle2"></div>

<div class="register-container">

    <div class="system-title">
        Traffic Violation System
    </div>

    <div class="sub-title">
        Create your account
    </div>

    <form id="registerForm">

        <div class="input-group">
            <label>Username</label>
            <input
                    type="text"
                    id="username"
                    placeholder="Nhập username"
                    required>
        </div>

        <div class="input-group">
            <label>Full Name</label>
            <input
                    type="text"
                    id="full_name"
                    placeholder="Nhập họ và tên"
                    required>
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <input
                    type="text"
                    id="phone_number"
                    placeholder="Nhập số điện thoại"
                    required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" required minlength="8"
                   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                   placeholder="Nhập mật khẩu">
        </div>

        <button type="submit" id="submitBtn" class="register-btn">
            Đăng ký
        </button>

    </form>

    <div class="login-link">
        Đã có tài khoản?
        <a th:href="@{/login}">
            Đăng nhập
        </a>
    </div>

    <div class="footer-text">
        © 2026 Traffic Violation Detection System
    </div>

</div>

<script th:inline="javascript">
    document.getElementById('registerForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const submitBtn = document.getElementById('submitBtn');

        const username = document.getElementById('username').value.trim();
        const full_name = document.getElementById('full_name').value.trim();
        const phone_number = document.getElementById('phone_number').value.trim();
        const password = document.getElementById('password').value;

        const payload = {
            username,
            full_name,
            phone_number,
            password
        };

        try {
            submitBtn.disabled = true;
            submitBtn.innerText = 'Đang xử lý...';

            // Gọi API (Đường dẫn công khai đã sửa ở bước trước)
            const response = await fetch('/user/api/createUserAcc', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                showToast('Đăng ký tài khoản thành công! Đang chuyển hướng...', 'success');

                setTimeout(() => {
                    window.location.href = '/login';
                }, 1600);
            } else {
                let errorMsg = 'Đăng ký thất bại. Vui lòng thử lại.';

                try {
                    const errorData = await response.json();
                    if (errorData.message) {
                        errorMsg = errorData.message;
                    } else if (typeof errorData === 'object') {
                        // Nối các thông báo lỗi Validation lại với nhau dấu phẩy hoặc xuống dòng
                        errorMsg = Object.values(errorData).join('<br>');
                    }
                } catch (e) {
                    const textError = await response.text();
                    if (textError) errorMsg = textError;
                }

                showToast(errorMsg, 'error');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Đăng ký';
            }
        } catch (error) {
            console.error('Lỗi mạng:', error);
            showToast('Lỗi kết nối đến hệ thống máy chủ.', 'error');
            submitBtn.disabled = false;
            submitBtn.innerText = 'Đăng ký';
        }
    });

    /**
     * Hàm sinh thông báo Toast nổi góc màn hình và tự hủy sau 4 giây
     */
    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast-item ${type}`;

        // Cấu hình Icon tương ứng với trạng thái
        const icon = type === 'success'
            ? `<i class="fa-solid fa-circle-check" style="color: #16a34a;"></i>`
            : `<i class="fa-solid fa-circle-xmark" style="color: #dc2626;"></i>`;

        toast.innerHTML = `
            ${icon}
            <div class="toast-text">${message}</div>
        `;

        container.appendChild(toast);

        // Tạo hiệu ứng mờ dần và xóa phần tử khỏi DOM sau 4 giây
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(50px)';
            toast.style.transition = 'all 0.4s ease';
            setTimeout(() => toast.remove(), 400);
        }, 4000);
    }
</script>

</body>
</html>
