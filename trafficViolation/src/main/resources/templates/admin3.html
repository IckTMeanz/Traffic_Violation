<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Violation Detect — Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --primary-light: #DBEAFE;
            --bg-slate: #F8FAFC;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --success: #16A34A;
            --danger: #DC2626;
            --warning: #F59E0B;
            --sidebar-width: 280px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-slate);
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .h-44 { height: 44px !important; }
        .rounded-xl-custom { border-radius: 12px !important; }
        .rounded-2xl-custom { border-radius: 16px !important; }

        .admin-sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #ffffff;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px;
            z-index: 100;
        }

        .main-dashboard-content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            padding: 40px;
            width: calc(100% - var(--sidebar-width));
        }

        .brand-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px 24px 12px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .system-logo {
            background-color: var(--primary);
            color: white;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-menu-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-menu-btn {
            width: 100%;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.925rem;
            padding: 12px 16px;
            border-radius: 12px;
            transition: all 0.2s ease-in-out;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .sidebar-menu-btn:hover {
            background-color: var(--bg-slate);
            color: var(--text-dark);
        }

        .sidebar-menu-btn.active {
            background-color: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }

        .signout-wrapper {
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        .btn-signout {
            width: 100%;
            border: none;
            background: transparent;
            color: #EF4444;
            font-weight: 500;
            font-size: 0.925rem;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease-in-out;
        }

        .btn-signout:hover {
            background-color: #FEF2F2;
            color: #DC2626;
        }

        .search-wrapper { position: relative; }
        .search-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        .search-wrapper input { padding-left: 44px !important; }

        .input-icon-wrapper { position: relative; }
        .input-icon-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        .input-icon-wrapper input { padding-left: 44px !important; }

        .btn-primary-custom {
            background-color: var(--primary);
            border: none;
            color: white;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            color: white;
        }

        .btn-secondary-custom {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-secondary-custom:hover {
            background-color: var(--bg-slate);
            color: var(--text-dark);
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .badge-authority {
            background-color: #FFFBEB;
            color: #B45309;
            border: 1px solid #FDE68A;
        }
        .badge-user {
            background-color: #EFF6FF;
            color: #1D4ED8;
            border: 1px solid #BFDBFE;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 9999px;
        }
        .status-active {
            background-color: #ECFDF5;
            color: #065F46;
        }
        .status-active::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: var(--success);
            border-radius: 50%;
        }
        .status-locked {
            background-color: #FEF2F2;
            color: #991B1B;
        }
        .status-locked::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: var(--danger);
            border-radius: 50%;
        }

        .toggle-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            transition: color 0.2s;
        }
        /* Disabled state khi đang gọi API */
        .toggle-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .fade-in-section {
            animation: fadeIn 0.3s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loading skeleton */
        .skeleton-row td {
            padding: 16px;
        }
        .skeleton-cell {
            height: 16px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 6px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Toast notification */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.10);
            font-size: 0.875rem;
            font-weight: 500;
            min-width: 260px;
            animation: slideUp 0.25s ease;
        }
        .toast-item.success { border-left: 4px solid var(--success); }
        .toast-item.error { border-left: 4px solid var(--danger); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1024px) {
            .admin-sidebar {
                width: 70px;
                padding: 24px 8px;
            }
            .admin-sidebar .brand-title,
            .admin-sidebar .menu-text { display: none; }
            .brand-wrapper {
                padding: 8px 0 24px 0;
                justify-content: center;
            }
            .sidebar-menu-btn, .btn-signout {
                justify-content: center;
                padding: 12px;
            }
            .main-dashboard-content {
                margin-left: 70px;
                width: calc(100% - 70px);
                padding: 24px;
            }
        }
    </style>
</head>
<body>

<!-- Toast container -->
<div class="toast-container" id="toast-container"></div>

<aside class="admin-sidebar">
    <div>
        <div class="brand-wrapper">
            <div class="system-logo rounded-xl-custom">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <span class="brand-title fw-bold fs-5 tracking-tight text-dark">Traffic Detect</span>
        </div>

        <nav>
            <ul class="nav-menu-list">
                <li>
                    <button id="tab-users-btn" class="sidebar-menu-btn active" onclick="switchTab('users')">
                        <i class="fa-solid fa-users fa-fw"></i>
                        <span class="menu-text">User management</span>
                    </button>
                </li>
                <li>
                    <button id="tab-create-btn" class="sidebar-menu-btn" onclick="switchTab('create_authority')">
                        <i class="fa-solid fa-user-plus fa-fw"></i>
                        <span class="menu-text">Create authority account</span>
                    </button>
                </li>
            </ul>
        </nav>
    </div>

    <div class="signout-wrapper">
        <button class="btn-signout" onclick="handleSignOut()">
            <i class="fa-solid fa-right-from-bracket fa-fw"></i>
            <span class="menu-text">Sign out</span>
        </button>
    </div>
</aside>

<main class="main-dashboard-content">

    <div id="section-users" class="fade-in-section">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 mb-4">
            <div>
                <h2 class="h3 fw-bold mb-1">Quản lý người dùng</h2>
                <p class="text-secondary small mb-0">Danh sách toàn bộ tài khoản người dân và cán bộ trong hệ thống.</p>
            </div>

            <div class="search-wrapper w-100" style="max-width: 320px;">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="user-search-input" oninput="handleSearch()" class="form-control h-44 rounded-xl-custom text-sm" placeholder="Tìm theo tên hoặc email...">
            </div>
        </div>

        <div class="card rounded-2xl-custom border-0 shadow-sm overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 text-sm">
                    <thead class="table-light border-bottom text-uppercase tracking-wider text-secondary" style="font-size: 0.75rem; font-weight: 600;">
                    <tr>
                        <th class="px-4 py-3">Họ và tên</th>
                        <th class="px-4 py-3">Tên đăng nhập</th>
                        <th class="px-4 py-3">Số điện thoại</th>
                        <th class="px-4 py-3">Vai trò</th>
                        <th class="px-4 py-3">Trạng thái</th>
                        <th class="px-4 py-3 text-end">Hành động</th>
                    </tr>
                    </thead>
                    <tbody id="user-table-body" class="divide-y">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="section-create-auth" class="fade-in-section d-none">
        <div class="row justify-content-center pt-4">
            <div class="col-12 col-xl-8">
                <div class="card rounded-2xl-custom border-0 shadow-sm p-4 p-sm-5 bg-white" style="max-width: 600px; margin: 0 auto;">

                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center rounded-xl-custom text-amber-600 mb-3" style="background-color: #FFFBEB; width: 48px; height: 48px; border: 1px solid #FDE68A;">
                            <i class="fa-solid fa-user-plus fa-lg"></i>
                        </div>
                        <h2 class="h4 fw-bold text-dark">Cấp tài khoản cơ quan chức năng</h2>
                        <p class="text-secondary small">Tài khoản khởi tạo sẽ mặc định được cấp quyền kiểm duyệt (ROLE_AUTHORITY).</p>
                    </div>

                    <form id="create-auth-form" onsubmit="handleCreateAccount(event)" class="needs-validation" novalidate>

                        <div class="mb-3">
                            <label class="form-label font-medium small text-dark mb-1">Họ và tên cán bộ</label>
                            <div class="input-icon-wrapper">
                                <i class="fa-regular fa-user"></i>
                                <input type="text" id="reg-name" required class="form-control h-44 rounded-xl-custom text-sm" placeholder="Ví dụ: Nguyễn Văn Hải">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label font-medium small text-dark mb-1">Tên đăng nhập</label>
                            <div class="input-icon-wrapper">
                                <i class="fa-regular fa-envelope"></i>
                                <input type="text" id="reg-username" required class="form-control h-44 rounded-xl-custom text-sm" placeholder="Ví dụ: nguyenvana">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label font-medium small text-dark mb-1">Số điện thoại</label>
                            <div class="input-icon-wrapper">
                                <i class="fa-solid fa-phone"></i>
                                <input type="tel" id="reg-phone" class="form-control h-44 rounded-xl-custom text-sm" placeholder="Nhập số điện thoại liên hệ">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label font-medium small text-dark mb-1">Mật khẩu khởi tạo</label>
                            <input type="password" id="reg-password" required class="form-control h-44 rounded-xl-custom text-sm px-3" placeholder="••••••••">
                        </div>

                        <div class="d-flex gap-3 pt-2">
                            <button type="button" onclick="cancelAndResetForm()" class="btn btn-secondary-custom h-44 rounded-xl-custom flex-grow-1">Hủy bỏ</button>
                            <button type="submit" class="btn btn-primary-custom h-44 rounded-xl-custom flex-grow-1">Tạo tài khoản</button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>

</main>

<script>
    // ================================================================
    // STATE
    // ================================================================
    let usersData = [];           // Cache toàn bộ user từ API
    let pendingToggle = new Set(); // Các userId đang chờ API toggle

    // ================================================================
    // API CALLS
    // ================================================================

    /**
     * Lấy danh sách tất cả người dùng từ REST API
     * GET /admin/api/all → List<UserDTO>
     * UserDTO fields: id, username, full_name, phone_number, role, is_active
     */
    async function fetchAllUsers() {
        renderLoadingSkeleton();
        try {
            const res = await fetch('/admin/api/all');
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            usersData = await res.json();
            renderUserTable(usersData);
        } catch (err) {
            console.error('Lỗi tải danh sách người dùng:', err);
            showToast('Không thể tải danh sách người dùng. Vui lòng thử lại.', 'error');
            renderErrorState();
        }
    }

    /**
     * Thay đổi trạng thái active/locked của user
     * PUT /admin/api/changeStatus/{id}
     */
    async function apiChangeStatus(userId) {
        const res = await fetch(`/admin/api/changeStatus/${userId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
    }

    // ================================================================
    // UI RENDER
    // ================================================================

    function renderLoadingSkeleton() {
        const tbody = document.getElementById('user-table-body');
        tbody.innerHTML = Array.from({ length: 5 }).map(() => `
                <tr class="skeleton-row border-bottom">
                    <td><div class="skeleton-cell" style="width:140px"></div></td>
                    <td><div class="skeleton-cell" style="width:160px"></div></td>
                    <td><div class="skeleton-cell" style="width:110px"></div></td>
                    <td><div class="skeleton-cell" style="width:90px"></div></td>
                    <td><div class="skeleton-cell" style="width:100px"></div></td>
                    <td class="text-end"><div class="skeleton-cell" style="width:36px;margin-left:auto"></div></td>
                </tr>
            `).join('');
    }

    function renderErrorState() {
        const tbody = document.getElementById('user-table-body');
        tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center py-5 text-secondary">
                        <i class="fa-solid fa-triangle-exclamation fa-lg mb-2 d-block text-warning"></i>
                        Không thể tải dữ liệu. <a href="#" onclick="fetchAllUsers(); return false;" class="text-primary">Thử lại</a>
                    </td>
                </tr>`;
    }

    function renderUserTable(data) {
        const tbody = document.getElementById('user-table-body');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-secondary py-5">
                            Không tìm thấy người dùng nào phù hợp.
                        </td>
                    </tr>`;
            return;
        }

        data.forEach(user => {
            // UserDTO dùng snake_case: full_name, phone_number, is_active
            const isActive = user.is_active;
            const isLoading = pendingToggle.has(user.id);

            let roleBadge = '';

            if (user.role === 'ROLE_ADMIN') {
                roleBadge = `
        <span
            class="px-2 py-1 rounded"
            style="
                font-size:0.75rem;
                font-weight:500;
                background-color:#FEF2F2;
                color:#DC2626;
                border:1px solid #FECACA;
            "
        >
            Quản trị viên
        </span>
    `;
            } else if (user.role === 'ROLE_AUTHORITY') {
                roleBadge = `
        <span
            class="badge badge-authority px-2 py-1 rounded"
            style="font-size:0.75rem;font-weight:500"
        >
            Cán bộ kiểm duyệt
        </span>
    `;
            } else {
                roleBadge = `
        <span
            class="badge badge-user px-2 py-1 rounded"
            style="font-size:0.75rem;font-weight:500"
        >
            Người dân
        </span>
    `;
            }

            const statusIndicator = isActive
                ? `<span class="status-indicator status-active">Đang hoạt động</span>`
                : `<span class="status-indicator status-locked">Bị khóa</span>`;

            const toggleIcon = isLoading
                ? `<i class="fa-solid fa-spinner fa-spin text-secondary"></i>`
                : isActive
                    ? `<i class="fa-solid fa-toggle-on text-success"></i>`
                    : `<i class="fa-solid fa-toggle-off text-secondary"></i>`;
            const actionButton = user.role === 'ROLE_ADMIN'
                ? `<span class="text-danger small fw-semibold">Không thể khóa</span>`
                : `
        <button
            class="toggle-btn"
            id="toggle-btn-${user.id}"
            onclick="toggleUserStatus(${user.id})"
            title="${isActive ? 'Khóa tài khoản' : 'Mở khóa tài khoản'}"
            ${isLoading ? 'disabled' : ''}
        >
            ${toggleIcon}
        </button>
    `;
            const row = document.createElement('tr');
            row.className = 'border-bottom';
            row.id = `user-row-${user.id}`;
            row.innerHTML = `
                    <td class="px-4 py-3 fw-medium text-dark">${escapeHtml(user.full_name || '—')}</td>
                    <td class="px-4 py-3 text-secondary">${escapeHtml(user.username || '—')}</td>
                    <td class="px-4 py-3 text-secondary">${escapeHtml(user.phone_number || '—')}</td>
                    <td class="px-4 py-3">${roleBadge}</td>
                    <td class="px-4 py-3">${statusIndicator}</td>
                    <td class="px-4 py-3 text-end">
    ${actionButton}
</td>
                `;
            tbody.appendChild(row);
        });
    }

    // ================================================================
    // INTERACTIONS
    // ================================================================

    /**
     * Toggle trạng thái user:
     * 1. Optimistic update (cập nhật UI ngay)
     * 2. Gọi API PUT /admin/api/changeStatus/{id}
     * 3. Nếu lỗi: rollback lại trạng thái cũ
     */
    async function toggleUserStatus(userId) {
        if (pendingToggle.has(userId)) return; // Đang xử lý, bỏ qua click kép

        const userIndex = usersData.findIndex(u => u.id === userId);
        if (userIndex === -1) return;

        const originalStatus = usersData[userIndex].is_active;

        // Optimistic update
        pendingToggle.add(userId);
        usersData[userIndex].is_active = !originalStatus;
        refreshRow(usersData[userIndex]);

        try {
            await apiChangeStatus(userId);
            const newStatus = usersData[userIndex].is_active;
            showToast(
                newStatus
                    ? `Đã mở khóa tài khoản "${usersData[userIndex].full_name}"`
                    : `Đã khóa tài khoản "${usersData[userIndex].full_name}"`,
                'success'
            );
        } catch (err) {
            // Rollback nếu API lỗi
            console.error('Lỗi thay đổi trạng thái:', err);
            usersData[userIndex].is_active = originalStatus;
            showToast('Thao tác thất bại. Vui lòng thử lại.', 'error');
        } finally {
            pendingToggle.delete(userId);
            refreshRow(usersData[userIndex]);
        }
    }

    /**
     * Cập nhật lại một hàng cụ thể trong bảng (không re-render cả bảng)
     */
    function refreshRow(user) {
        const isActive = user.is_active;
        const isLoading = pendingToggle.has(user.id);

        const btn = document.getElementById(`toggle-btn-${user.id}`);
        if (!btn) return;

        btn.disabled = isLoading;
        btn.title = isActive ? 'Khóa tài khoản' : 'Mở khóa tài khoản';
        btn.innerHTML = isLoading
            ? `<i class="fa-solid fa-spinner fa-spin text-secondary"></i>`
            : isActive
                ? `<i class="fa-solid fa-toggle-on text-success"></i>`
                : `<i class="fa-solid fa-toggle-off text-secondary"></i>`;

        const row = document.getElementById(`user-row-${user.id}`);
        if (!row) return;
        const statusCell = row.querySelector('td:nth-child(5)');
        if (statusCell) {
            statusCell.innerHTML = isActive
                ? `<span class="status-indicator status-active">Đang hoạt động</span>`
                : `<span class="status-indicator status-locked">Bị khóa</span>`;
        }
    }

    // Real-time search (lọc trên usersData đã cache)
    function handleSearch() {
        const query = document.getElementById('user-search-input').value.toLowerCase().trim();
        const filtered = usersData.filter(u =>
            (u.full_name || '').toLowerCase().includes(query) ||
            (u.username || '').toLowerCase().includes(query)
        );
        renderUserTable(filtered);
    }

    // ================================================================
    // TAB NAVIGATION
    // ================================================================
    function switchTab(tabName) {
        const usersSection = document.getElementById('section-users');
        const createAuthSection = document.getElementById('section-create-auth');
        const tabUsersBtn = document.getElementById('tab-users-btn');
        const tabCreateBtn = document.getElementById('tab-create-btn');

        if (tabName === 'users') {
            usersSection.classList.remove('d-none');
            createAuthSection.classList.add('d-none');
            tabUsersBtn.classList.add('active');
            tabCreateBtn.classList.remove('active');
            // Refresh data khi quay lại tab users
            fetchAllUsers();
        } else {
            usersSection.classList.add('d-none');
            createAuthSection.classList.remove('d-none');
            tabUsersBtn.classList.remove('active');
            tabCreateBtn.classList.add('active');
        }
    }

    // ================================================================
    // CREATE AUTHORITY FORM
    // ================================================================
    function handleCreateAccount(event) {
        event.preventDefault();
        const form = document.getElementById('create-auth-form');
        if (!form.checkValidity()) {
            form.classList.add('was-validated');
            return;
        }

        const fullName = document.getElementById('reg-name').value;
        const username = document.getElementById('reg-username').value;
        const phone = document.getElementById('reg-phone').value;
        const password = document.getElementById('reg-password').value;

        // TODO: gọi API tạo tài khoản cơ quan (POST /admin/api/create hoặc tương tự)
        // Hiện tại hiển thị thông báo tạm
        showToast(`Tạo tài khoản thành công cho: ${fullName}`, 'success');
        cancelAndResetForm();
    }

    function cancelAndResetForm() {
        const form = document.getElementById('create-auth-form');
        form.reset();
        form.classList.remove('was-validated');
        switchTab('users');
    }

    // ================================================================
    // SIGN OUT
    // ================================================================
    function handleSignOut() {
        if (confirm('Bạn có chắc chắn muốn đăng xuất khỏi hệ thống quản trị?')) {
            window.location.href = '/login';
        }
    }

    // ================================================================
    // TOAST NOTIFICATION
    // ================================================================
    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast-item ${type}`;
        const icon = type === 'success'
            ? `<i class="fa-solid fa-circle-check text-success"></i>`
            : `<i class="fa-solid fa-circle-xmark text-danger"></i>`;
        toast.innerHTML = `${icon} <span>${escapeHtml(message)}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // ================================================================
    // UTILS
    // ================================================================
    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // ================================================================
    // INIT
    // ================================================================
    document.addEventListener('DOMContentLoaded', () => {
        fetchAllUsers();
    });
</script>
